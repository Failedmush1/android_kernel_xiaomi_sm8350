name: Build Kernel
on:
  workflow_dispatch:
jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          
      - name: Make build.sh Executable
        run: chmod +x build.sh # <--- ADDED STEP: Ensures the script can be run
          
      - name: Checkout proton-clang Toolchain
        uses: actions/checkout@v4
        with:
          repository: kdrag0n/proton-clang
          path: toolchain
          
      - name: Setup PATH and Environment Variables
        run: |
          # Add toolchain bin directory to PATH
          echo "${{ github.workspace }}/toolchain/bin" >> $GITHUB_PATH
          # Explicitly set ARCH and CROSS_COMPILE for the build script's environment
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          
      - name: Install prerequisites
        run: |
          sudo apt update
          # Install necessary build dependencies. 
          sudo apt install -y build-essential bc curl git zip ftp libssl-dev lftp zstd wget libfl-dev python2 python3 libarchive-tools
          
      - name: Build kernel
        run: |
          # This should now execute successfully:
          ./build.sh buildksu
          
          # Move the output zip file from the anykernel directory to the root
          mv ../out/anykernel/*.zip .
          
          # Robust way to select the first zip file and set environment variables
          releaseFile=$(ls -1 *.zip | head -n 1)
          releaseTag=$(basename $releaseFile .zip)
          
          echo "RELEASE_FILE=$releaseFile" >> $GITHUB_ENV
          echo "RELEASE_TAG=$releaseTag" >> $GITHUB_ENV
          
      - name: Upload kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: renoir
          path: ${{ env.RELEASE_FILE }}
          
      - name: Create release
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.RELEASE_FILE }}
          generate_release_notes: true
