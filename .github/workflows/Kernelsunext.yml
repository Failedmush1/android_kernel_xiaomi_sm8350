## ⚙️ Standalone Kernel Build - Toolchain Setup Skipped

name: Standalone Kernel Build

on:
  push:
    # Trigger on push to the LineageOS 23 test branch
    branches:
      - lineage-23.0-test 
  pull_request:
    # Trigger on PRs targeting the LineageOS 23 test branch
    branches:
      - lineage-23.0-test

jobs:
  build:
    # Using a modern Ubuntu image, which often has cross-compilers available
    container: ubuntu:22.04 
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      
    - name: Install Build Dependencies
      run: |
        # Installing common dependencies and the system's cross-compiler (aarch64)
        apt update
        apt install -y make gcc-aarch64-linux-gnu flex bison libssl-dev bc kmod python3 cpio
        
    - name: Set Environment Variables (Minimal)
      run: |
        # Set target architecture
        export ARCH=arm64
        export SUBARCH=arm64
        # Relying on the installed system cross-compiler (aarch64-linux-gnu-)
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        echo "SUBARCH=$SUBARCH" >> $GITHUB_ENV
        echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
        
    - name: Configure Kernel (Copying .config)
      run: |
        cd kernel/xiaomi/sm8350
        # Copy the final configuration from the successful ROM build path
        # Adjusting the path below to reference the workspace root
        cp $GITHUB_WORKSPACE/out/target/product/renoir/obj/KERNEL_OBJ/.config .

    - name: Build Kernel
      run: |
        cd kernel/xiaomi/sm8350
        # Build using the environment variables set in the previous step
        # O=out is used to keep the source tree clean
        make O=out -j$(nproc)
